
{% extends "base.html" %}

{% block content %}

<div class="container mt-4">
    <h2>{{ title }}</h2>

    {% for message in messages %}
        <div class="alert alert-warning">
            {{ message }}
        </div>
    {% endfor %}

    <div class="card shadow-sm mt-3">
        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                {% if department %}
                    <div class="mb-3">
                        <label for="department_id" class="form-label">
                            Department ID
                        </label>

                        <input
                            type="text"
                            id="department_id"
                            class="form-control"
                            value="{{ department.id }}"
                            readonly
                        >
                    </div>
                {% endif %}

                <div class="mb-3">
                    <label for="name" class="form-label">
                        Department Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        class="form-control"
                        placeholder="Enter department name"
                        value="{{ department.name|default:'' }}"
                        maxlength="100"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-primary">
                    Save Department
                </button>

                <a href="{% url 'department_list' %}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>
</div>

{% endblock %}
